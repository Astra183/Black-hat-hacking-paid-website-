<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TEAM ASTRA LOGIN PAGE</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#000 url('https://i.ibb.co/cKLF4L1t/file-00000000b4d8622fa11bc2a847c77dd7.png') no-repeat center/cover;
      overflow:hidden;
    }
    .login-box{
      width:360px;padding:36px;background:rgba(255,255,255,0.06);border-radius:14px;
      box-shadow:0 12px 40px rgba(0,0,0,0.6);backdrop-filter:blur(10px);color:#fff;text-align:center;
      position:relative;
    }
    .login-box h2{font-size:20px;letter-spacing:2px;margin-bottom:18px;text-transform:uppercase;
      animation:neonText 4s infinite alternate}
    @keyframes neonText{0%{color:#ff00ff}50%{color:#00ffd5}100%{color:#7928ca}
      102%{color:#b50909}
    }
    .input-box{margin:12px 0}
    .input-box input{width:100%;padding:12px 16px;border-radius:22px;border:1px solid rgba(255,255,255,0.18);
      background:transparent;color:#fff;outline:none;font-size:14px}
    .input-box input::placeholder{color:rgba(255,255,255,0.5);font-style:italic}
    .options{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:12px 0 18px}
    .checkbox-wrapper{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;color:#fff}
    .checkbox-wrapper input{display:none}
    .checkmark{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,0.18);
      display:inline-flex;align-items:center;justify-content:center;transition:all .25s ease;position:relative}
    .checkmark::after{content:"";width:7px;height:12px;border:solid transparent;border-width:0 3px 3px 0;
      transform:rotate(45deg) scale(0);transition:transform .25s ease}
    .checkbox-wrapper input:checked ~ .checkmark{border-color:#00ffd5;box-shadow:0 0 12px #00ffd5,0 0 22px #ff00ff;
      animation:glow 1s infinite alternate}
    .checkbox-wrapper input:checked ~ .checkmark::after{border-color:#00ffd5;transform:rotate(45deg) scale(1)}
    @keyframes glow{from{box-shadow:0 0 6px #00ffd5}to{box-shadow:0 0 18px #ff00ff}}
    .btn{position:relative;width:100%;padding:12px;border:none;border-radius:22px;
      background:linear-gradient(90deg,#ff0080,#7928ca,#00ffd5);background-size:300% 100%;
      color:#fff;font-size:15px;cursor:pointer;overflow:hidden;transition:transform .25s;
      box-shadow:0 6px 30px rgba(0,0,0,0.6);animation:gradientMove 5s linear infinite}
    .btn:hover{transform:scale(1.03)}
    @keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .msg{margin-top:14px;min-height:22px;font-size:14px;color:#ff8888;transition:all .2s ease}
    .msg.success{color:#8effb0;text-shadow:0 0 10px #00ff99}
    .shake{animation:shake .35s}
    @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
    .login-box p{margin-top:12px;font-size:13px;color:#ddd}
    .login-box p a{color:#00ffd5;text-decoration:none;font-weight:600}

    /* WARNING overlay (hidden by default) */
    .warn-overlay {
      position: absolute;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      opacity:0;
      transform:scale(0.98);
      transition:opacity 1.25s, transform 1.25s;
      z-index:40;
    }
    .warn-overlay.active {
      opacity:1;
      transform:scale(1);
      pointer-events:auto;
    }
    .warn-badge {
      padding:18px 18px;
      border-radius:12px;
      background: linear-gradient(90deg, rgba(255,0,80,0.18), rgba(255,50,50,0.12));
      border:1px solid rgba(255,0,80,0.28);
      color:#ffb3b3;
      box-shadow:0 8px 40px rgba(255,0,80,0.08);
      text-align:center;
      backdrop-filter: blur(6px);
      animation: pulseWarn 0.9s ease-in-out infinite;
    }
    @keyframes pulseWarn {
      0% { transform: scale(1); box-shadow: 0 6px 30px rgba(255,0,80,0.06); }
      50% { transform: scale(1.04); box-shadow: 0 18px 60px rgba(255,0,80,0.14); }
      100% { transform: scale(1); box-shadow: 0 6px 30px rgba(255,0,80,0.06); }
    }

    /* small icon inside badge */
    .warn-badge .icon {
      font-weight:700; font-size:20px; margin-bottom:6px; display:block;
    }
  </style>
</head>
<body>
  <div class="login-box" id="box">
    <h2>TEAM ASTRA PAID ACCESS</h2>

    <form id="loginForm" autocomplete="off">
      <div class="input-box">
        <input id="email" type="email" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input id="password" type="password" placeholder="Password" required>
      </div>

      <div class="options">
        <label class="checkbox-wrapper">
          <input id="remember" type="checkbox">
          <span class="checkmark"></span>
          <span style="font-size:13px;">Remember me</span>
        </label>
        <a
        href="https://myaccount.google.com/signinoptions/password?pli=1&rapt=AEjHL4NC2fOZ_yJtb-pl7OAJqOLvdLdiJykRhZqWd_UDO3OeW7ediOqwvitfoDSiu3f4OdoFy55azuQrav4YgUXsgDhFN8rSKaUSPRId83jWGANOYGBZNkU"
        id="forgot">Forgot Password?</a>
      </div>

      <button type="submit" class="btn" id="loginBtn">Login</button>
      <div class="msg" id="msg"></div>

      <p style="font-size:12px;margin-top:12px;color:#aaa">
        Don’t have an account? <a href="https://wa.me/message/AQ4L33CGR5S2B1" target="_blank">Register</a>
      </p>
    </form>

    <!-- Warning overlay -->
    <div class="warn-overlay" id="warnOverlay" aria-hidden="true">
      <div class="warn-badge" id="warnBadge">
        <span class="icon">⚠️</span>
        <div id="warnText">Warning — Invalid credentials</div>
      </div>
    </div>
  </div>

  <script>
    const allowedEmail = "Teamastrahacks786@gmail.com".toLowerCase(); 
    const allowedPassword = "The Lord"; 
    const redirectURL = "https://example.com/secret"; // set secret target URL

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const msg = document.getElementById('msg');
    const box = document.getElementById('box');
    const warnOverlay = document.getElementById('warnOverlay');
    const warnText = document.getElementById('warnText');

    
    function speak(text, opts = {}) {
      if(!('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = opts.lang || 'en-US';
      utter.rate = (opts.rate !== undefined) ? opts.rate : 1;
      utter.pitch = (opts.pitch !== undefined) ? opts.pitch : 1;
      
      const voices = window.speechSynthesis.getVoices();
      if(voices && voices.length){
      
        utter.voice = voices.find(v=>v.lang.startsWith('en') && /female|f/i.test(v.name)) || voices.find(v=>v.lang.startsWith('en')) || voices[0];
      }
      window.speechSynthesis.speak(utter);
    }

    
    let warnCooldown = false;
    function showWarning(message){
      if(warnCooldown) return;
      warnCooldown = true;
      warnText.textContent = message || 'Warning — Invalid credentials';
      warnOverlay.classList.add('active');
      
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      
      speak(message || 'Warning. Invalid credentials. Please try again.', {lang:'en-US', rate:1});
      
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 520;
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.value = 0.0001;
        o.start();
        
        g.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.01);
        g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        setTimeout(()=>{ o.stop(); ctx.close(); }, 220);
      } catch(e){ /* ignore audio errors */ }

      // hide after 1.6s and reset cooldown after 2s
      setTimeout(()=>{ warnOverlay.classList.remove('active'); }, 1600);
      setTimeout(()=>{ warnCooldown = false; }, 2200);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = (emailInput.value || '').trim().toLowerCase();
      const pwd = passInput.value || '';

      if(email === allowedEmail && pwd === allowedPassword){
        // Success
        msg.textContent = "Access Granted — Redirecting...";
        msg.classList.remove('shake'); msg.classList.add('success');
        // speak success
        speak('Congratulations. You successfully logged in.', {lang:'en-US', rate:1});
        // short delay so user hears message (and sees glow)
        setTimeout(() => {
          // SAME TAB redirect
          window.location.href = redirectURL;
        }, 900); // <1s
      } else {
        // Fail — show warning overlay + voice
        msg.textContent = "Invalid credentials!";
        msg.classList.remove('success'); msg.classList.add('shake');
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        passInput.value = '';
        showWarning('Warning. Invalid credentials Access Denied.');
      }
    });

    // Improve speech availability on some browsers: load voices
    if ('speechSynthesis' in window) {
      // iOS/Chrome sometimes require getVoices trigger
      window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
      window.speechSynthesis.getVoices();
    }

    // forgot demo
    document.getElementById('forgot').addEventListener('click', (ev) => {
      ev.preventDefault();
      speak('Contact the admin to reset your password Hacking by team astra.', {lang:'en-US', rate:1});
      alert('Contact the admin to reset');
    });
  </script>
</body>
</html>
